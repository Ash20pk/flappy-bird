specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: BirdGame
    network: arbitrum-sepolia
    source:
      address: "0x56979559a754298832776ABe8a92050dDBE36325"
      abi: BirdGame
      startBlock: 82780198
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - BirdMintedEvent
        - GamePlayedEvent
        - LevelUpEvent
        - PlayerRegisteredEvent
        - Bird
        - Game
        - Player
        - GameHistory
      abis:
        - name: BirdGame
          file: BirdGame/abis/BirdGame.json
      eventHandlers:
        - event: BirdMinted(indexed address,indexed uint256,uint256)
          handler: handleBirdMinted
        - event: GamePlayed(indexed uint256,uint256,uint256,uint256)
          handler: handleGamePlayed
        - event: LevelUp(indexed uint256,uint256)
          handler: handleLevelUp
        - event: PlayerRegistered(indexed address,string)
          handler: handlePlayerRegistered
      file: BirdGame/BirdGame.wasm
